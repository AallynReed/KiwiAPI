[package]
name = "kiwi-core"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
gif = "0.14.2"
image-webp = "0.2.4"
kiwi-zlib = { version = "0.1.0", path = "../kiwi-zlib" }
mozjpeg = { version = "0.10.13", default-features = false }
png = "0.18.1"
regex = "1.13.1"
roxmltree = "0.20.0"
rustc-hash = "2.1.3"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
speedate = "=0.17.0"
stacker = "0.1.25"
strum = "0.27"
unicode-normalization = "0.1.26"

[build-dependencies]
cc = "1.9.0"
