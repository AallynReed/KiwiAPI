[package]
name = "kiwi-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
crc32fast = "1.5.0"
getrandom = "0.3.4"
hex = "0.4.3"
hmac = "0.13.0"
percent-encoding = "2.3.2"
sha1 = "0.11.0"
sha2 = "0.11.1"
deadpool-postgres = "0.14.2"
dotenvy = "0.15.7"
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
kiwi-core = { version = "0.1.0", path = "../kiwi-core" }
mimalloc = "0.1.52"
mongodb = "3.9.1"
regex = "1.13.1"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
