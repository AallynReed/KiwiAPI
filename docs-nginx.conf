# nginx config for the docs container — clean (extensionless) page URLs.
# `/reference` serves reference.html, `/` serves index.html, etc. The old
# `.html` paths still resolve (handy for any existing links/bookmarks).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the live OpenAPI spec same-origin by proxying to the `api` container
    # on the internal compose network. This way the Redoc reference page doesn't
    # depend on the public api.aallyn.net proxy exposing /openapi.json (it only
    # routes /v1 + /health) or on cross-origin CORS. The variable + resolver make
    # it survive the api container restarting with a new IP.
    location = /openapi.json {
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS
        set $kiwi_api api;
        proxy_pass http://$kiwi_api:8000/openapi.json;
        proxy_set_header Host $host;
        # Always serve the live spec; never let it cache stale.
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        # Docs change often; don't let them go stale behind a cache.
        add_header Cache-Control "no-cache";
    }
}
