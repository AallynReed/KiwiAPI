server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # dev.aallyn.net serves ONLY the static SPA. It calls api.aallyn.net directly
    # (cross-origin; the API enables CORS for this origin). No API proxying here.
    location / {
        try_files $uri $uri/ /index.html;

        # nginx note: add_header in a location does NOT inherit server-level ones,
        # so all headers for the SPA live here together.

        # SPA files keep the same names across deploys — force revalidation.
        add_header Cache-Control "no-cache" always;

        # Security headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # CSP: allow the app's own assets, Cloudflare Turnstile, and calls to the
        # API. 'unsafe-inline'/'unsafe-eval' are permitted for scripts because the
        # Turnstile widget needs them; everything external is otherwise blocked,
        # and frame-ancestors 'none' stops clickjacking.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.aallyn.net https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" always;
    }
}
