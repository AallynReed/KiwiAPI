<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ player_name }} - Trove player profile - Better Trove Tools</title>
    <meta name="description" content="{{ og_desc }}">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">

    <link rel="canonical" href="{{ og_page_url }}">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="shortcut icon" href="/static/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/favicon.png">

    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="Better Trove Tools">
    <meta property="og:url" content="{{ og_page_url }}">
    <meta property="og:title" content="{{ og_title }}">
    <meta property="og:description" content="{{ og_desc }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ og_title }}">
    <meta name="twitter:description" content="{{ og_desc }}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.min.css">
    <link rel="stylesheet" href="/static/player.min.css">
</head>
<body class="landing player-page" data-player="{{ player_name }}">

    <a class="skip-link" href="#main">Skip to main content</a>

    {% include "partials/navbar.html" %}

    <main id="main" class="pl-main">
        <section class="pl-hero">
            <p class="pl-eyebrow">/player</p>
            <div class="pl-head">
                <div class="pl-avatar" id="pl-avatar" aria-hidden="true"></div>
                <div class="pl-head-text">
                    <h1 class="pl-name" id="pl-name">{{ player_name }}</h1>
                    <span class="pl-badge" id="pl-verified" hidden>
                        <i class="fa-solid fa-shield-check" aria-hidden="true"></i>
                        <span data-i18n>Verified player</span>
                    </span>
                </div>
            </div>
        </section>

        <section class="pl-stats" id="pl-stats" aria-label="Summary">
            <!-- stat chips injected by player.js -->
        </section>

        <section class="pl-section">
            <h2 class="pl-subhead" data-i18n>Recent appearances</h2>
            <div id="pl-recent"><p class="pl-loading" data-i18n>Loading…</p></div>
        </section>

        <p class="pl-foot-link">
            <a href="/leaderboards" data-i18n>Browse all leaderboards</a>
        </p>
    </main>

    {% include "partials/footer.html" %}

    <script src="/static/app.min.js"></script>
    <script src="/static/i18n.min.js"></script>
    <script src="/static/player.min.js" defer></script>
</body>
</html>
