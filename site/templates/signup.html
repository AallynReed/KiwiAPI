<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create account — Better Trove Tools</title>
    <meta name="description" content="Create a Better Trove Tools account to claim your Trove player name, follow your leaderboard ranks, and more.">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://trove.aallyn.net/signup">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="/static/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.min.css?v=20260608f">
    <link rel="stylesheet" href="/static/account.min.css?v=20260608f">
</head>
<body class="landing account-page">

    <a class="skip-link" href="#main">Skip to main content</a>

    {% include "partials/navbar.html" %}

    <main id="main" class="acc-main">
        <section class="acc-card">
            <h1 class="acc-title" data-i18n>Create your account</h1>
            <p class="acc-sub" data-i18n>Pick a username, confirm your email, claim your Trove player name.</p>

            <form id="signup-form" class="acc-form" autocomplete="on">
                <label class="acc-field">
                    <span class="acc-label" data-i18n>Username</span>
                    <input type="text" id="signup-username" name="username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]{3,24}" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-placeholder placeholder="3–24 chars, letters/digits/underscore">
                    <span class="acc-hint" data-i18n>Lowercased on submit. Public-facing — pick something you'd like other players to see.</span>
                </label>
                <label class="acc-field">
                    <span class="acc-label" data-i18n>Email</span>
                    <input type="email" id="signup-email" name="email" required autocomplete="email">
                    <span class="acc-hint" data-i18n>We'll send a verification link. Required before you can claim a Trove name.</span>
                </label>
                <label class="acc-field">
                    <span class="acc-label" data-i18n>Password</span>
                    <input type="password" id="signup-password" name="password" required minlength="8" autocomplete="new-password">
                    <span class="acc-hint" data-i18n>At least 8 characters. We check against known breach lists on submit.</span>
                </label>
                <label class="acc-field acc-field-optional">
                    <span class="acc-label">
                        <span data-i18n>Display name</span>
                        <span class="acc-optional" data-i18n>(optional)</span>
                    </span>
                    <input type="text" id="signup-display-name" name="display_name" maxlength="80" autocomplete="nickname">
                </label>

                <p class="acc-error" id="signup-error" hidden></p>

                <!-- Captcha mount; rendered by site_auth.js. Hidden when
                     captcha isn't configured server-side. -->
                <div class="acc-captcha" id="signup-captcha"></div>

                <button type="submit" class="acc-submit" id="signup-submit">
                    <span data-i18n>Create account</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <p class="acc-alt">
                <span data-i18n>Already have an account?</span>
                <a href="/login" data-i18n>Sign in</a>
            </p>
        </section>
    </main>

    {% include "partials/footer.html" %}

    <script src="/static/app.min.js?v=20260608f"></script>
    <script src="/static/i18n.min.js?v=20260608f"></script>
    <script src="/static/site_auth.min.js?v=20260608f"></script>
</body>
</html>
