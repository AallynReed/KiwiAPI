<ul class="wk-classgrid" role="list">
    {% for c in classes %}
    <li><a class="wk-classcard" href="{{ c.url }}">
        <img src="/static/class-icons/{{ c.tech }}.png" alt="" width="40" height="40">
        <span class="wk-classcard-text">
            <span class="wk-classcard-name">{{ c.name }}</span>
            <span class="wk-classcard-dmg dmg-{{ c.dmg_class }}">{{ c.damage_type }}</span>
        </span>
    </a></li>
    {% endfor %}
</ul>
