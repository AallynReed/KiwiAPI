<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Website changelog - Better Trove Tools</title>
    <meta name="description" content="Every change to the Better Trove Tools website and API, straight from the open-source commit history - for full transparency.">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">

    <link rel="canonical" href="https://trove.aallyn.net/changelog">

    <link rel="shortcut icon" href="/static/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/favicon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Better Trove Tools">
    <meta property="og:url" content="https://trove.aallyn.net/changelog">
    <meta property="og:title" content="Website changelog - Better Trove Tools">
    <meta property="og:description" content="Every change to the site and API, straight from the open-source commit history.">
    <meta property="og:image" content="https://trove.aallyn.net/static/assets/favicon.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Website changelog - Better Trove Tools">
    <meta name="twitter:description" content="Every change to the site and API, from the open-source commit history.">

    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/fonts/fontawesome.min.css">

    <link rel="stylesheet" href="/static/style.min.css">
    <link rel="stylesheet" href="/static/changelog.min.css">
</head>
<body class="landing cl-page">

    <a class="skip-link" href="#main" data-i18n>Skip to main content</a>

    {% include "partials/navbar.html" %}

    <main id="main" class="cl-main">
        <section class="cl-hero">
            <p class="cl-eyebrow">/changelog</p>
            <h1 class="cl-title" data-i18n>Website changelog</h1>
            <p class="cl-sub" data-i18n>Every change to the site and API, straight from the open-source commit history. No spin - this is the actual work log.</p>
            <a class="cl-repo-link" href="{{ repo_url }}" target="_blank" rel="noopener">
                <i class="fa-brands fa-github" aria-hidden="true"></i>
                <span data-i18n>View the source on GitHub</span>
            </a>
        </section>

        <!-- Grouped commit history, filled by changelog.js from /site/changelog. -->
        <section class="cl-body" aria-label="Changelog">
            <div class="cl-list" id="cl-list" aria-live="polite">
                <p class="cl-loading" data-i18n>Loading changelog…</p>
            </div>
        </section>
    </main>

    {% include "partials/footer.html" %}

    <script src="/static/app.min.js"></script>
    <script src="/static/_site_util.min.js"></script>
    <script src="/static/i18n.min.js"></script>
    <script src="/static/site_auth.min.js" defer></script>
    <script src="/static/changelog.min.js" defer></script>
</body>
</html>
