<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Forgot your password? — Better Trove Tools</title>
    <meta name="description" content="Reset your Better Trove Tools account password — we'll email you a link.">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://trove.aallyn.net/forgot-password">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="/static/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.min.css?v=20260608g">
    <link rel="stylesheet" href="/static/account.min.css?v=20260608g">
</head>
<body class="landing account-page">
    <a class="skip-link" href="#main">Skip to main content</a>

    {% include "partials/navbar.html" %}

    <main id="main" class="acc-main">
        <section class="acc-card">
            <h1 class="acc-title" data-i18n>Forgot your password?</h1>
            <p class="acc-sub" data-i18n>Enter your account email — we'll send you a link to set a new password.</p>

            <form id="forgot-form" class="acc-form" autocomplete="on">
                <label class="acc-field">
                    <span class="acc-label" data-i18n>Email</span>
                    <input type="email" id="forgot-email" name="email" required autocomplete="email" autocapitalize="off" spellcheck="false">
                </label>

                <p class="acc-error" id="forgot-error" hidden></p>
                <p class="acc-success" id="forgot-success" hidden></p>

                <div class="acc-captcha" id="forgot-captcha"></div>

                <button type="submit" class="acc-submit" id="forgot-submit">
                    <span data-i18n>Send reset link</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <p class="acc-alt">
                <span data-i18n>Remembered it?</span>
                <a href="/login" data-i18n>Sign in</a>
            </p>
        </section>
    </main>

    {% include "partials/footer.html" %}

    <script src="/static/app.min.js?v=20260608g"></script>
    <script src="/static/i18n.min.js?v=20260608g"></script>
    <script src="/static/site_auth.min.js?v=20260608g"></script>
    <script src="/static/password_reset.min.js?v=20260608g" defer></script>
</body>
</html>
