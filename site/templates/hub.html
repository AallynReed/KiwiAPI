<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ hub.meta_title }} - Better Trove Tools</title>
    <meta name="description" content="{{ hub.meta_description }}">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">

    <link rel="canonical" href="https://trove.aallyn.net{{ hub.path }}">

    <link rel="shortcut icon" href="/static/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/favicon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Better Trove Tools">
    <meta property="og:url" content="https://trove.aallyn.net{{ hub.path }}">
    <meta property="og:title" content="{{ hub.meta_title }}">
    <meta property="og:description" content="{{ hub.meta_description }}">
    <meta property="og:image" content="https://trove.aallyn.net/static/assets/favicon.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ hub.meta_title }}">
    <meta name="twitter:description" content="{{ hub.meta_description }}">

    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/fonts/fontawesome.min.css">

    <link rel="stylesheet" href="/static/style.min.css">
    <link rel="stylesheet" href="/static/hub.min.css">
</head>
<body class="landing hb-page">

    <a class="skip-link" href="#main" data-i18n>Skip to main content</a>

    {% include "partials/navbar.html" %}

    <main id="main" class="hb-main">
        <section class="hb-hero">
            <p class="hb-eyebrow">{{ hub.path }}</p>
            <h1 class="hb-title" data-i18n>{{ hub.title | safe }}</h1>
            <p class="hb-sub" data-i18n>{{ hub.sub }}</p>
        </section>

        <!-- A hub, no JS: each row is a page whose own feature flag is on. Add a
             row in app/site/hubs.py and it appears here. -->
        <div class="hb-list">
            {% for e in hub.entries %}
            <a class="hb-card" href="{{ e.path }}">
                <span class="hb-icon"><i class="{{ e.icon }}" aria-hidden="true"></i></span>
                <span class="hb-body">
                    <span class="hb-name">{{ e.name }}<span class="hb-kind">{{ e.kind }}</span></span>
                    <span class="hb-blurb">{{ e.blurb }}</span>
                </span>
                <i class="fa-solid fa-arrow-right hb-go" aria-hidden="true"></i>
            </a>
            {% endfor %}
        </div>

        {% if not hub.entries %}
        <p class="hb-empty" data-i18n>{{ hub.empty }}</p>
        {% endif %}
    </main>

    {% include "partials/footer.html" %}

    <script src="/static/app.min.js"></script>
    <script src="/static/_site_util.min.js"></script>
    <script src="/static/i18n.min.js"></script>
    <script src="/static/site_auth.min.js" defer></script>
</body>
</html>
