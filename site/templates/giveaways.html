<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Giveaways - Better Trove Tools</title>
    <meta name="description" content="Enter Better Trove Tools giveaways for Trove prize codes. See live entry counts and your odds of winning.">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">

    <link rel="canonical" href="https://trove.aallyn.net/giveaways">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="shortcut icon" href="/static/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/favicon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Better Trove Tools">
    <meta property="og:title" content="Giveaways">
    <meta property="og:description" content="Enter Better Trove Tools giveaways for Trove prize codes.">
    <meta property="og:image" content="https://trove.aallyn.net/static/assets/favicon.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.min.css">
    <link rel="stylesheet" href="/static/giveaways.min.css">
</head>
<body class="landing giveaways-page">

    <a class="skip-link" href="#main">Skip to main content</a>

    {% include "partials/navbar.html" %}

    <main id="main" class="gw-main">

        <section class="gw-hero">
            <div class="gw-hero-inner">
                <p class="gw-eyebrow">/giveaways</p>
                <h1 class="gw-title" data-i18n>Giveaways</h1>
                <p class="gw-subtitle" data-i18n>Enter for Trove prize codes. One entry per account - sign in with Discord, and if you win we'll email your code.</p>
            </div>
        </section>

        <!-- JS (giveaways.js) renders the grouped cards here: open, upcoming,
             and past. Entry counts + your odds update live; the countdown
             ticks every second. -->
        <div id="gw-list" aria-live="polite">
            <p class="gw-loading" data-i18n>Loading giveaways…</p>
        </div>
    </main>

    {% include "partials/footer.html" %}

    <script src="/static/app.min.js"></script>
    <script src="/static/_site_util.min.js"></script>
    <script src="/static/i18n.min.js"></script>
    <script src="/static/site_auth.min.js" defer></script>
    <script src="/static/giveaways.min.js" defer></script>
</body>
</html>
