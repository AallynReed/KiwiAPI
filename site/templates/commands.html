<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trove commands - Better Trove Tools</title>
    <meta name="description" content="Every Trove in-game slash command, categorised and searchable, in 7 languages.">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">

    <link rel="canonical" href="https://trove.aallyn.net/commands">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="shortcut icon" href="/static/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/favicon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Better Trove Tools">
    <meta property="og:title" content="Trove commands">
    <meta property="og:description" content="Every Trove slash command, categorised, searchable, 7 languages.">
    <meta property="og:image" content="https://trove.aallyn.net/static/assets/favicon.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.min.css">
    <link rel="stylesheet" href="/static/commands.css">
</head>
<body class="landing commands-page">

    <a class="skip-link" href="#main">Skip to main content</a>

    {% include "partials/navbar.html" %}

    <main id="main" class="commands-main">

        <!-- ═══════════════ HERO + INTRO ═══════════════
             Pulled live from commands.json so all 7 languages render
             without page reload. Hero stays compact (no full-bleed
             treatment) because the long content below IS the page. -->
        <section class="commands-hero">
            <div class="commands-hero-inner">
                <p class="commands-eyebrow">/commands</p>
                <h1 class="commands-title" data-cmd-text="title">Trove commands</h1>
                <p class="commands-subtitle" data-cmd-text="subtitle">Every slash command, categorised and searchable.</p>

                <div class="commands-toolbar" role="search">
                    <i class="fa-solid fa-magnifying-glass commands-search-icon" aria-hidden="true"></i>
                    <input type="search" id="commands-search" class="commands-search"
                           data-cmd-placeholder="search_placeholder" placeholder="Search commands…"
                           autocomplete="off" spellcheck="false">
                    <span class="commands-count"><span id="commands-count-num">-</span></span>
                </div>

                <details class="commands-rules">
                    <summary><i class="fa-solid fa-circle-info"></i> Syntax conventions</summary>
                    <ul id="commands-rules-list"></ul>
                </details>
            </div>
        </section>

        <!-- ═══════════════ CATEGORY CHIPS ═══════════════
             Clicking a chip scrolls to that category's section. The
             active chip mirrors what's currently in viewport via
             IntersectionObserver in commands.js. -->
        <nav class="commands-chips" id="commands-chips" aria-label="Jump to category"></nav>

        <!-- ═══════════════ COMMAND LIST ═══════════════ -->
        <section class="commands-list" id="commands-list" aria-live="polite">
            <p class="commands-loading" id="commands-loading">Loading…</p>
        </section>

        <p class="commands-source" id="commands-source"></p>
    </main>

    {% include "partials/footer.html" %}

    <script src="/static/app.min.js"></script>
    <script src="/static/i18n.min.js"></script>
    <script src="/static/site_auth.min.js" defer></script>
    <script src="/static/commands.js" defer></script>
</body>
</html>
