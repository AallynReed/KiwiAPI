<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in - Better Trove Tools</title>
    <meta name="description" content="Sign in to your Better Trove Tools account to claim your Trove player name and view your stats.">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://trove.aallyn.net/login">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="/static/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.min.css">
    <link rel="stylesheet" href="/static/account.min.css">
</head>
<body class="landing account-page">

    <a class="skip-link" href="#main">Skip to main content</a>

    {% include "partials/navbar.html" %}

    <main id="main" class="acc-main">
        <section class="acc-card">
            <h1 class="acc-title" data-i18n>Sign in</h1>
            <p class="acc-sub" data-i18n>Sign in with your Discord account.</p>

            <!-- Kept (even with no password form) so site_auth.js can surface
                 a failed OAuth round-trip here. -->
            <p class="acc-error" id="login-error" hidden></p>

            {% if discord_oauth_enabled %}
            <a class="acc-oauth-btn acc-oauth-discord" href="https://api.aallyn.net/v1/site-auth/oauth/discord/start">
                <i class="fa-brands fa-discord" aria-hidden="true"></i>
                <span data-i18n>Sign in with Discord</span>
            </a>
            {% else %}
            <p class="acc-sub" data-i18n>Sign-in is temporarily unavailable. Please check back soon.</p>
            {% endif %}
        </section>
    </main>

    {% include "partials/footer.html" %}

    <script src="/static/app.min.js"></script>
    <script src="/static/i18n.min.js"></script>
    <script src="/static/site_auth.min.js"></script>
</body>
</html>
