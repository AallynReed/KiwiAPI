<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign in — Better Trove Tools</title>
    <meta name="description" content="Sign in to your Better Trove Tools account to claim your Trove player name and view your stats.">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://trove.aallyn.net/login">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="/static/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/assets/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.min.css?v=20260608f">
    <link rel="stylesheet" href="/static/account.min.css?v=20260608f">
</head>
<body class="landing account-page">

    <a class="skip-link" href="#main">Skip to main content</a>

    {% include "partials/navbar.html" %}

    <main id="main" class="acc-main">
        <section class="acc-card">
            <h1 class="acc-title" data-i18n>Sign in</h1>
            <p class="acc-sub" data-i18n>Welcome back. Sign in with your username or email.</p>

            <form id="login-form" class="acc-form" autocomplete="on">
                <label class="acc-field">
                    <span class="acc-label" data-i18n>Username or email</span>
                    <input type="text" id="login-identifier" name="identifier" required autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
                </label>
                <label class="acc-field">
                    <span class="acc-label" data-i18n>Password</span>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password">
                </label>

                <p class="acc-error" id="login-error" hidden></p>

                <!-- Captcha mount. site_auth.js fetches /config to see
                     which provider is configured (hCaptcha / Turnstile)
                     and renders the widget here. Disappears entirely
                     when the API isn't configured for captcha. -->
                <div class="acc-captcha" id="login-captcha"></div>

                <button type="submit" class="acc-submit" id="login-submit">
                    <span data-i18n>Sign in</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>

            <p class="acc-alt">
                <span data-i18n>No account yet?</span>
                <a href="/signup" data-i18n>Create one</a>
            </p>
            <p class="acc-alt acc-alt-mini">
                <a href="/forgot-password" data-i18n>Forgot your password?</a>
                <span class="acc-alt-sep">·</span>
                <a href="#" id="resend-verify-link" data-i18n>Resend verification email</a>
            </p>
        </section>
    </main>

    {% include "partials/footer.html" %}

    <script src="/static/app.min.js?v=20260608f"></script>
    <script src="/static/i18n.min.js?v=20260608f"></script>
    <script src="/static/site_auth.min.js?v=20260608f"></script>
</body>
</html>
