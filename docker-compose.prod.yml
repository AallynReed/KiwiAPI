# Production overrides. Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Swaps the dev --reload (single worker) for multiple uvicorn workers and no
# auto-reload. Code still comes from the ./app bind mount (synced), so a deploy
# = sync + recreate; for fully immutable deploys, bake the image instead.
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--workers", "${API_WORKERS:-8}",
              "--timeout-graceful-shutdown", "3"]

  # Website (presentation only) - a few workers is plenty; it does no heavy CPU,
  # just template rendering + thin internal_get fan-out to the api.
  web:
    command: ["uvicorn", "app.web.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--workers", "${WEB_WORKERS:-4}"]
