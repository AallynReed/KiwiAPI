# Production overrides. Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Runs the Python app with several uvicorn workers. Code still comes from the
# ./app bind mount (synced), so a deploy = sync + recreate; for fully immutable
# deploys, bake the image instead. kiwi-server (api) and kiwi-web (web) need no
# override: each is one multi-threaded process.
services:
  api-py:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--workers", "${API_WORKERS:-8}",
              "--timeout-keep-alive", "120", "--timeout-graceful-shutdown", "3"]

  # Python website behind kiwi-web (presentation only) - a few workers is plenty;
  # it does no heavy CPU, just template rendering + thin internal_get fan-out.
  web-py:
    command: ["uvicorn", "app.web.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--workers", "${WEB_WORKERS:-4}",
              "--timeout-keep-alive", "120"]
