# Production overrides. Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Runs the Python fallback (trove-app image) with several uvicorn workers; its code
# comes from the ./app bind mount. The Rust services (trove-rust image: api, web,
# bot; trove-builder) need no override: each is one multi-threaded process, and
# what they read from app/ is baked in, so they pick up changes only on a rebuild.
services:
  api-py:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--workers", "${API_WORKERS:-8}",
              "--timeout-keep-alive", "120", "--timeout-graceful-shutdown", "3"]

  # Python website behind kiwi-web (presentation only) - a few workers is plenty;
  # it does no heavy CPU, just template rendering + thin internal_get fan-out.
  web-py:
    command: ["uvicorn", "app.web.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--workers", "${WEB_WORKERS:-4}",
              "--timeout-keep-alive", "120"]
