<style>
  :root{--bg:#0c1120;--ink:#e8edf7;--ink-2:#aab5cb;--ink-3:#97a3bd;--gold:#f2c46b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;
    background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif}
  .mt{max-width:560px;text-align:center}
  .mt-art{display:block;width:min(100%,440px);height:auto;margin:0 auto 12px}
  .mt h1{font-size:clamp(1.875rem,3.4vw,2.75rem);font-weight:800;line-height:1.05;letter-spacing:-.025em;margin:0 0 12px}
  .mt p{color:var(--ink-2);font-size:1.0625rem;line-height:1.55;max-width:44ch;margin:0 auto 28px}
  .mt-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:8px;
    background:var(--gold);color:var(--bg);font-weight:600;text-decoration:none}
  .mt-btn:active{transform:translateY(1px)}
  .mt-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .mt .mt-mark{color:var(--ink-3);font-size:.875rem;margin:32px auto 0}
  .mt-beacon{animation:mt-blink 1.6s steps(1) infinite}
  .mt-hook{transform-box:view-box;animation:mt-swing 4s ease-in-out infinite alternate}
  @keyframes mt-blink{50%{opacity:.2}}
  @keyframes mt-swing{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
  @media (prefers-reduced-motion:reduce){.mt-beacon,.mt-hook{animation:none}}
</style></head>
