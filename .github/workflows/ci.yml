name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (pyright)
        run: pyright
        continue-on-error: true  # advisory for now

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests (testcontainers → Docker)
        run: pytest tests/integration -q -m integration

      - name: Dependency audit
        run: pip-audit -r requirements.txt
        continue-on-error: true  # advisory; don't block on upstream CVEs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kiwi-api:ci .
